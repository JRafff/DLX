<text x="555.0" y="522" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700" >5 cycles of full pipeline freeze</text>
<text x="791.0" y="550" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" >Ready is high for exactly one cycle; the cache latches the word on that edge.</text>
<rect x="70" y="560" width="1320" height="77" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
<text x="82" y="579" font-size="12" fill="#1f2937" text-anchor="start" font-weight="700" >What this costs in practice</text>
<text x="82" y="597" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >Measured on test_pro_stress.asm: 229 of the 294 cycles the program takes are I-cache miss cycles — 78 % of the run.</text>
<text x="82" y="612" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >With 1-word lines every instruction misses the first time it is fetched, so the cache only pays off inside loops.</text>
<text x="82" y="627" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >Discounting those stalls the core sustains a CPI of about 1.3, which is what forwarding and the BTB actually deliver.</text>
