<text x="26" y="40" font-size="21" fill="#1f2937" text-anchor="start" font-weight="600" >I-cache miss &#8212; IRAM handshake and the resulting pipeline freeze</text>
<text x="26" y="62" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >The IRAM models a slow memory: LATENCY = 3 clock cycles between the read request and the data. A miss therefore</text>
<text x="26" y="79" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >costs five cycles of full pipeline freeze before fetch can continue.</text>
<text x="26" y="96" font-size="12" fill="#9ca3af" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >src/core/a.b-IFStage.core/a.b.d-IRAM.vhd</text>
