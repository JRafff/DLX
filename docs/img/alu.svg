<text x="26" y="40" font-size="21" fill="#1f2937" text-anchor="start" font-weight="600" >ALU &#8212; four parallel functional units, one output multiplexer</text>
<text x="26" y="62" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >Every unit is always computing; ALU_OPCODE only chooses which result reaches the output and how the shared</text>
<text x="26" y="79" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >blocks are configured. The set-compare instructions reuse the adder’s flags instead of adding a second comparator.</text>
<text x="26" y="96" font-size="12" fill="#9ca3af" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >src/core/a.d-EXStage.core/a.d.a-ALU.vhd</text>
