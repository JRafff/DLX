<rect x="70" y="792" width="1380" height="92" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.3"/>
<text x="82" y="811" font-size="12" fill="#1f2937" text-anchor="start" font-weight="700" >Set-compare instructions ride on the adder</text>
<text x="82" y="829" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >SGE / SGEI  →  ALU_OUT(0) = NOT (N XOR V)        signed ‘greater or equal’ straight from the subtractor’s flags</text>
<text x="82" y="844" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >SLE / SLEI  →  ALU_OUT(0) = (N XOR V) OR Z        signed ‘less or equal’</text>
<text x="82" y="859" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >SNE / SNEI  →  the dedicated equality comparator, which is cheaper than a full subtraction for this one case</text>
<text x="82" y="874" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >A relational compare therefore costs no extra datapath: the subtractor is already there for SUB, and only three gates are added on top of its flags.</text>
