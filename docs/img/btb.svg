<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 830" width="1420" height="830" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="1420" height="830" fill="#ffffff"/>
<defs><marker id="a-data" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e3a5f"/></marker><marker id="a-ctrl" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker><marker id="a-fwd" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d97706"/></marker><marker id="a-bnd" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker><marker id="a-ok" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker></defs>
<text x="26" y="40" font-size="21" fill="#1f2937" text-anchor="start" font-weight="600" >Branch Target Buffer + 2-bit Branch History Table</text>
<text x="26" y="62" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >64 direct-mapped entries indexed by PC[7:2]. The read port is combinational and lives in FETCH; the write port is</text>
<text x="26" y="79" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >clocked and lives in DECODE, where branch_resolution already knows the real outcome.</text>
<text x="26" y="96" font-size="12" fill="#9ca3af" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >src/core/a.b-IFStage.core/a.b.b-BTB.vhd</text>
<text x="60" y="136" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600" >PC (byte address)</text>
<rect x="60" y="150" width="330" height="46" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="225.0" y="144" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >31 . . . 8</text>
<text x="225.0" y="178" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="600" >tag</text>
<text x="225.0" y="212" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >24 bit</text>
<rect x="396" y="150" width="150" height="46" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="471.0" y="144" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >7 . . . 2</text>
<text x="471.0" y="178" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="600" >index</text>
<text x="471.0" y="212" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >6 bit</text>
<rect x="552" y="150" width="80" height="46" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="592.0" y="144" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >1 0</text>
<text x="592.0" y="178" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="600" >—</text>
<text x="592.0" y="212" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >2 bit</text>
<text x="60" y="254" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600" >BTB entry (record btb_entry, 64 of them)</text>
<rect x="60" y="268" width="80" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="100.0" y="292" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="700" >Valid</text>
<text x="100.0" y="308" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >1 bit</text>
<rect x="148" y="268" width="230" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="263.0" y="292" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="700" >Tag</text>
<text x="263.0" y="308" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >24 bit</text>
<rect x="386" y="268" width="260" height="52" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="516.0" y="292" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="700" >Target</text>
<text x="516.0" y="308" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >32 bit</text>
<rect x="654" y="268" width="150" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="729.0" y="292" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="700" >History</text>
<text x="729.0" y="308" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >2 bit</text>
<rect x="60" y="400" width="300" height="90" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="210.0" y="442.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="600" >Read port (FETCH)</text>
<text x="210.0" y="458.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >combinational: index → entry</text>
<text x="210.0" y="470.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >valid AND tag match AND History[1]</text>
<path d="M360,430 L470,430" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" marker-end="url(#a-fwd)"/>
<text x="476" y="434" font-size="12" fill="#d97706" text-anchor="start" font-weight="700" >taken</text>
<path d="M360,462 L470,462" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" marker-end="url(#a-fwd)"/>
<text x="476" y="466" font-size="11.5" fill="#d97706" text-anchor="start" font-weight="600" >Predicted_target → PC_sel</text>
<text x="60" y="516" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >History[1] alone decides the prediction: ‘10’ and ‘11’ predict taken,</text>
<text x="60" y="533" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >‘00’ and ‘01’ predict not-taken.</text>
<rect x="60" y="572" width="300" height="90" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="210.0" y="614.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="600" >Write port (DECODE)</text>
<text x="210.0" y="630.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >clocked: allocate on miss,</text>
<text x="210.0" y="642.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >saturate the counter on hit</text>
<path d="M470,602 L360,602" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" marker-end="url(#a-bnd)"/>
<text x="476" y="606" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="600" >update_en, Actual_Taken, Actual_Target</text>
<text x="60" y="688" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >Allocation on a tag miss seeds the counter with ‘10’ (weakly taken) if the</text>
<text x="60" y="705" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >branch was taken, ‘01’ (weakly not-taken) otherwise.</text>
<rect x="776" y="258" width="620" height="340" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="792" y="284" font-size="13" fill="#1f2937" text-anchor="start" font-weight="700" >2-bit saturating counter (per entry)</text>
<circle cx="876" cy="360" r="34" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="876" y="356" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >00</text>
<text x="876" y="372" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="400" >strongly</text>
<text x="876" y="383" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="400" >not taken</text>
<circle cx="1028" cy="360" r="34" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="1028" y="356" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >01</text>
<text x="1028" y="372" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="400" >weakly</text>
<text x="1028" y="383" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="400" >not taken</text>
<circle cx="1180" cy="360" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="1180" y="356" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >10</text>
<text x="1180" y="372" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="400" >weakly</text>
<text x="1180" y="383" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="400" >taken</text>
<circle cx="1332" cy="360" r="34" fill="#bbf7d0" stroke="#059669" stroke-width="1.8"/>
<text x="1332" y="356" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >11</text>
<text x="1332" y="372" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="400" >strongly</text>
<text x="1332" y="383" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="400" >taken</text>
<path d="M900,336 Q952.0,280 1004,336" fill="none" stroke="#059669" stroke-width="1.9" marker-end="url(#a-ok)"/>
<path d="M1004,384 Q952.0,440 900,384" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#a-bnd)"/>
<path d="M1052,336 Q1104.0,280 1156,336" fill="none" stroke="#059669" stroke-width="1.9" marker-end="url(#a-ok)"/>
<path d="M1156,384 Q1104.0,440 1052,384" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#a-bnd)"/>
<path d="M1204,336 Q1256.0,280 1308,336" fill="none" stroke="#059669" stroke-width="1.9" marker-end="url(#a-ok)"/>
<path d="M1308,384 Q1256.0,440 1204,384" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#a-bnd)"/>
<path d="M846,374 A 26,26 0 1 1 846,346" fill="none" stroke="#dc2626" stroke-width="1.7" marker-end="url(#a-bnd)"/>
<path d="M1362,346 A 26,26 0 1 1 1362,374" fill="none" stroke="#059669" stroke-width="1.7" marker-end="url(#a-ok)"/>
<text x="1104.0" y="280" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="600" >branch taken → count up (saturates at 11)</text>
<text x="1104.0" y="460" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="600" >branch not taken → count down (saturates at 00)</text>
<text x="1104.0" y="488" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" >Hysteresis is what makes a loop cost one mispredict, not two: the single</text>
<text x="1104.0" y="505" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" >not-taken exit only drops ‘11’ to ‘10’, so the entry still predicts taken</text>
<text x="1104.0" y="522" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400" >the next time the loop is entered.</text>
<rect x="60" y="714" width="1300" height="77" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
<text x="72" y="733" font-size="12" fill="#1f2937" text-anchor="start" font-weight="700" >Observed behaviour on the 4-iteration loop of the stress test</text>
<text x="72" y="751" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >First iteration of a backward loop: BTB misses → predict not-taken → branch is taken → 1 flush, entry allocated with ‘10’.</text>
<text x="72" y="766" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >Iterations 2..n-1: tag hits, History[1]=1 → fetch restarts from the target in the very next cycle → zero penalty.</text>
<text x="72" y="781" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >Last iteration: branch falls through → 1 flush and the counter drops to ‘01’ — measured exactly like this in test_pro_stress.asm.</text>
</svg>