<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="1280" height="900" fill="#ffffff"/>
<defs><marker id="a-data" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e3a5f"/></marker><marker id="a-ctrl" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker><marker id="a-fwd" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d97706"/></marker><marker id="a-bnd" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker><marker id="a-ok" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker></defs>
<text x="26" y="40" font-size="21" fill="#1f2937" text-anchor="start" font-weight="600" >Barrel shifter &#8212; coarse / fine two-level structure</text>
<text x="26" y="62" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >A flat 32:1 shift network would need 32 wide multiplexers. Splitting the amount into “bytes” and “bits”</text>
<text x="26" y="79" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >costs one 4:1 and one 8:1 multiplexer instead, at the price of two levels of delay.</text>
<text x="26" y="96" font-size="12" fill="#9ca3af" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >src/common/01-shifter.vhd</text>
<text x="70" y="170" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="700" >shift amount B</text>
<rect x="70" y="186" width="190" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="165.0" y="210" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >B[4:3]</text>
<text x="165.0" y="227" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >2 bit</text>
<text x="165.0" y="256" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >coarse: multiples of 8</text>
<rect x="280" y="186" width="190" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="375.0" y="210" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >B[2:0]</text>
<text x="375.0" y="227" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >3 bit</text>
<text x="375.0" y="256" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >fine: 0..7</text>
<text x="70" y="306" font-size="14" fill="#1f2937" text-anchor="start" font-weight="700" >Level 1 — COARSE</text>
<rect x="70" y="336" width="330" height="48" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="235.0" y="357.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600" >shift by 0</text>
<text x="235.0" y="373.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >coarse_masks(0)</text>
<rect x="70" y="394" width="330" height="48" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="235.0" y="415.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600" >shift by 8</text>
<text x="235.0" y="431.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >coarse_masks(1)</text>
<rect x="70" y="452" width="330" height="48" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="235.0" y="473.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600" >shift by 16</text>
<text x="235.0" y="489.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >coarse_masks(2)</text>
<rect x="70" y="510" width="330" height="48" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="235.0" y="531.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600" >shift by 24</text>
<text x="235.0" y="547.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" >coarse_masks(3)</text>
<path d="M520,336 L554,348 L554,544 L520,556 Z" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="537.0" y="450.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="600" >4:1</text>
<path d="M400,358 L520,360" fill="none" stroke="#1e3a5f" stroke-width="1.3" stroke-linecap="round" marker-end="url(#a-data)"/>
<path d="M400,416 L520,412" fill="none" stroke="#1e3a5f" stroke-width="1.3" stroke-linecap="round" marker-end="url(#a-data)"/>
<path d="M400,474 L520,464" fill="none" stroke="#1e3a5f" stroke-width="1.3" stroke-linecap="round" marker-end="url(#a-data)"/>
<path d="M400,532 L520,516" fill="none" stroke="#1e3a5f" stroke-width="1.3" stroke-linecap="round" marker-end="url(#a-data)"/>
<path d="M537,580 L537,556" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-ctrl)"/>
<text x="537" y="598" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >B[4:3]</text>
<path d="M554,446 L620,446" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round" marker-end="url(#a-data)"/>
<text x="586" y="432" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >40-bit intermediate</text>
<text x="660" y="306" font-size="14" fill="#1f2937" text-anchor="start" font-weight="700" >Level 2 — FINE</text>
<rect x="660" y="328" width="210" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1"/>
<text x="765.0" y="344.5" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="600" >shift by 0</text>
<rect x="660" y="358" width="210" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1"/>
<text x="765.0" y="374.5" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="600" >shift by 1</text>
<rect x="660" y="388" width="210" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1"/>
<text x="765.0" y="404.5" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="600" >shift by 2</text>
<rect x="660" y="418" width="210" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1"/>
<text x="765.0" y="434.5" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="600" >shift by 3</text>
<rect x="660" y="448" width="210" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1"/>
<text x="765.0" y="464.5" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="600" >shift by 4</text>
<rect x="660" y="478" width="210" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1"/>
<text x="765.0" y="494.5" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="600" >shift by 5</text>
<rect x="660" y="508" width="210" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1"/>
<text x="765.0" y="524.5" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="600" >shift by 6</text>
<rect x="660" y="538" width="210" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1"/>
<text x="765.0" y="554.5" font-size="10.5" fill="#1f2937" text-anchor="middle" font-weight="600" >shift by 7</text>
<path d="M920,328 L954,340 L954,568 L920,580 Z" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="937.0" y="458.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="600" >8:1</text>
<path d="M870,340 L920,350" fill="none" stroke="#1e3a5f" stroke-width="1.1" stroke-linecap="round"/>
<path d="M870,370 L920,378" fill="none" stroke="#1e3a5f" stroke-width="1.1" stroke-linecap="round"/>
<path d="M870,400 L920,406" fill="none" stroke="#1e3a5f" stroke-width="1.1" stroke-linecap="round"/>
<path d="M870,430 L920,434" fill="none" stroke="#1e3a5f" stroke-width="1.1" stroke-linecap="round"/>
<path d="M870,460 L920,462" fill="none" stroke="#1e3a5f" stroke-width="1.1" stroke-linecap="round"/>
<path d="M870,490 L920,490" fill="none" stroke="#1e3a5f" stroke-width="1.1" stroke-linecap="round"/>
<path d="M870,520 L920,518" fill="none" stroke="#1e3a5f" stroke-width="1.1" stroke-linecap="round"/>
<path d="M870,550 L920,546" fill="none" stroke="#1e3a5f" stroke-width="1.1" stroke-linecap="round"/>
<path d="M937,604 L937,580" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-ctrl)"/>
<text x="937" y="622" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >B[2:0]</text>
<path d="M954,454 L1040,454" fill="none" stroke="#1e3a5f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-data)"/>
<text x="1048" y="459" font-size="13" fill="#1f2937" text-anchor="start" font-weight="700" >shift_out</text>
<path d="M620,446 L660,446" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/>
<rect x="70" y="764" width="560" height="77" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="82" y="783" font-size="12" fill="#1f2937" text-anchor="start" font-weight="700" >Direction</text>
<text x="82" y="801" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >nLeft_right = 0 → logical left,  nLeft_right = 1 → logical right.</text>
<text x="82" y="816" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >Arithmetic right shift is not part of the implemented ISA, so no</text>
<text x="82" y="831" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >sign-replication network is instantiated.</text>
<rect x="650" y="764" width="560" height="77" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.3"/>
<text x="662" y="783" font-size="12" fill="#1f2937" text-anchor="start" font-weight="700" >Why the two-level split is cheaper</text>
<text x="662" y="801" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >4 coarse + 8 fine masks = 12 wide multiplexer inputs instead of 32</text>
<text x="662" y="816" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >for a flat design, at the cost of two levels of logic depth. The 40-bit</text>
<text x="662" y="831" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >intermediate carries the bits the coarse stage shifted past the word.</text>
</svg>