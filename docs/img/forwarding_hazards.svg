<text x="738" y="510" font-size="11" fill="#d97706" text-anchor="start" font-weight="600" >wb_data forwarded into EX in the very next cycle</text>
<text x="60" y="636" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >hazard_detector sees a LOAD in EX (EX_RF_WE=1 and EX_WB_MUX_SEL=1) whose Rd matches Rs1 or Rs2 in ID.</text>
<text x="60" y="654" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >The CU freezes PC and IF/ID and clears ID/EX, injecting one bubble. After that the load is in MEM/WB and the “01” channel delivers the data.</text>
