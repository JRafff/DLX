<text x="824" y="778" font-size="11" fill="#d97706" text-anchor="start" font-weight="600" >EX/MEM.alu_out → zero_check via forwarding_id</text>
<text x="667" y="855" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700" >flushed</text>
<text x="60" y="904" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >The branch reads Rs1 in ID while the producer is still in EX, so no forwarding path exists yet: branch_stall_alarm buys one cycle.</text>
<text x="60" y="922" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >If the producer is a LOAD the stall lasts two cycles, because exmem_alu_out holds the address, not the loaded word.</text>
