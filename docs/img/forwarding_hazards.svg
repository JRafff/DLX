<text x="26" y="40" font-size="21" fill="#1f2937" text-anchor="start" font-weight="600" >Forwarding &#8212; two independent units</text>
<text x="26" y="62" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >forwarding_unit feeds the EX stage; forwarding_id feeds the branch comparator in ID. Both give priority to</text>
<text x="26" y="79" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >EX/MEM over MEM/WB, because EX/MEM carries the more recent write to the same register.</text>
