<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="1400" height="760" fill="#ffffff"/>
<defs><marker id="a-data" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e3a5f"/></marker><marker id="a-ctrl" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker><marker id="a-fwd" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d97706"/></marker><marker id="a-bnd" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker><marker id="a-ok" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker></defs>
<text x="26" y="40" font-size="21" fill="#1f2937" text-anchor="start" font-weight="600" >Next-PC selection &#8212; a 4-input priority multiplexer</text>
<text x="26" y="62" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >Every redirection of the instruction stream converges here. The two mispredict inputs were added after</text>
<text x="26" y="79" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >bring-up: recovering only to the branch target was wrong whenever a predicted-taken branch fell through.</text>
<text x="26" y="96" font-size="12" fill="#9ca3af" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >src/core/a.b-IFStage.core/a.b.a-PC_sel.vhd</text>
<path d="M620,180 L664,192 L664,468 L620,480 Z" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="642.0" y="335.0" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700" >4:1</text>
<text x="642.0" y="168" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="700" >PC_sel</text>
<circle cx="46" cy="210" r="14" fill="#dc2626"/>
<text x="46" y="214.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >1</text>
<rect x="74" y="184" width="300" height="52" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<text x="224.0" y="207.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600" >recovery_address_in</text>
<text x="224.0" y="223.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >branch target computed in ID (NPC + imm)</text>
<path d="M374,210 L620,226" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-bnd)"/>
<text x="392" y="198" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >mispredict = 1  and  actual_taken = 1</text>
<text x="392" y="236" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="400" >priority 1</text>
<circle cx="46" cy="286" r="14" fill="#dc2626"/>
<text x="46" y="290.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >2</text>
<rect x="74" y="260" width="300" height="52" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<text x="224.0" y="283.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600" >branch_npc_in</text>
<text x="224.0" y="299.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >PC of the branch + 4, built inside IFStage</text>
<path d="M374,286 L620,296" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-bnd)"/>
<text x="392" y="274" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >mispredict = 1  and  actual_taken = 0</text>
<text x="392" y="312" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="400" >priority 2</text>
<circle cx="46" cy="362" r="14" fill="#d97706"/>
<text x="46" y="366.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >3</text>
<rect x="74" y="336" width="300" height="52" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<text x="224.0" y="359.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600" >predicted_target_in</text>
<text x="224.0" y="375.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >target supplied by the BTB</text>
<path d="M374,362 L620,366" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-fwd)"/>
<text x="392" y="350" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >taken = 1  (BTB predicts taken)</text>
<text x="392" y="388" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="400" >priority 3</text>
<circle cx="46" cy="438" r="14" fill="#1e3a5f"/>
<text x="46" y="442.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >4</text>
<rect x="74" y="412" width="300" height="52" rx="6" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.6"/>
<text x="224.0" y="435.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600" >npc_in</text>
<text x="224.0" y="451.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400" >PC + 4, the sequential case</text>
<path d="M374,438 L620,436" fill="none" stroke="#1e3a5f" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-data)"/>
<text x="392" y="426" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >default</text>
<text x="392" y="464" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="400" >priority 4</text>
<path d="M664,330.0 L754,330.0" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round" marker-end="url(#a-data)"/>
<text x="762" y="335.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="700" >PC_next</text>
<text x="762" y="354.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400" >latched into PC when PC_EN = 1</text>
<rect x="70" y="560" width="1270" height="107" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="82" y="579" font-size="12" fill="#1f2937" text-anchor="start" font-weight="700" >Why there are two mispredict inputs (see docs/notes/pc-recovery.md)</text>
<text x="82" y="597" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >Before the fix the mux had a single recovery input, the branch target. That is only correct when the BTB predicted</text>
<text x="82" y="612" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >not-taken and the branch is actually taken. In the opposite case — a loop exiting on its last iteration, where the BTB</text>
<text x="82" y="627" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >still predicts taken but the branch falls through — the PC was reloaded with the target and the loop never terminated.</text>
<text x="82" y="642" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >Adding actual_taken and the branch NPC to the mux resolves both directions; the wire that trains the BTB still carries</text>
<text x="82" y="657" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >the target, so the predictor is not corrupted. Verified on the 4-iteration loop of test_pro_stress.asm.</text>
</svg>