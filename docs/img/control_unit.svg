<rect x="544" y="162" width="150" height="5" rx="2" fill="#16a34a"/>
<text x="619.0" y="186" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >[3]</text>
<text x="619.0" y="202" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="700" >MUXB_SEL</text>
<text x="619.0" y="216" font-size="9.5" fill="#16a34a" text-anchor="middle" font-weight="600" >EX</text>
<rect x="702" y="162" width="150" height="60" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
<rect x="702" y="162" width="150" height="5" rx="2" fill="#b45309"/>
<text x="777.0" y="186" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >[2]</text>
<text x="777.0" y="202" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="700" >DRAM_WE</text>
<text x="777.0" y="216" font-size="9.5" fill="#b45309" text-anchor="middle" font-weight="600" >MEM</text>
<rect x="860" y="162" width="150" height="60" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
<rect x="860" y="162" width="150" height="5" rx="2" fill="#b45309"/>
<text x="935.0" y="186" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >[1]</text>
<text x="935.0" y="202" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="700" >WB_MUX_SEL</text>
<text x="935.0" y="216" font-size="9.5" fill="#b45309" text-anchor="middle" font-weight="600" >MEM/WB</text>
<rect x="1018" y="162" width="150" height="60" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="1018" y="162" width="150" height="5" rx="2" fill="#7c3aed"/>
<text x="1093.0" y="186" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >[0]</text>
<text x="1093.0" y="202" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="700" >RF_WE</text>
<text x="1093.0" y="216" font-size="9.5" fill="#7c3aed" text-anchor="middle" font-weight="600" >WB</text>
<text x="70" y="292" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="700" >Control-word pipeline inside the CU</text>
<rect x="70" y="306" width="250" height="96" rx="6" fill="#f1f5f9" stroke="#9ca3af" stroke-width="1.6"/>
<text x="195.0" y="351.0" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="600" >cw</text>
<text x="195.0" y="367.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >combinational</text>
<text x="195.0" y="379.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >ROM output</text>
<text x="195.0" y="391.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >used by ID</text>
<rect x="416" y="306" width="250" height="96" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="541.0" y="351.0" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="600" >cw1</text>
<text x="541.0" y="367.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >5 bits</text>
<text x="541.0" y="379.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >drives EX</text>
<path d="M320,354.0 L416,354.0" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round" marker-end="url(#a-data)"/>
<text x="368" y="344.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >clk</text>
<rect x="762" y="306" width="250" height="96" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="887.0" y="351.0" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="600" >cw2</text>
<text x="887.0" y="367.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >3 bits</text>
<text x="887.0" y="379.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >drives MEM</text>
<path d="M666,354.0 L762,354.0" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round" marker-end="url(#a-data)"/>
<text x="714" y="344.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >clk</text>
<rect x="1108" y="306" width="250" height="96" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1233.0" y="351.0" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="600" >cw3</text>
<text x="1233.0" y="367.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >2 bits</text>
<text x="1233.0" y="379.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400" >drives WB</text>
<path d="M1012,354.0 L1108,354.0" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round" marker-end="url(#a-data)"/>
<text x="1060" y="344.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >clk</text>
<path d="M195.0,402 L195.0,442" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-data)"/>
<text x="195.0" y="460" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="600" >JUMP_EN · EQ_COND</text>
<path d="M541.0,402 L541.0,442" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-data)"/>
<text x="541.0" y="460" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="600" >MUXA · MUXB · ALU_OPCODE</text>
<path d="M887.0,402 L887.0,442" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-data)"/>
<text x="887.0" y="460" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="600" >DRAM_WE</text>
<path d="M1233.0,402 L1233.0,442" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-data)"/>
<text x="1233.0" y="460" font-size="10.5" fill="#7c3aed" text-anchor="middle" font-weight="600" >WB_MUX_SEL · RF_WE</text>
<rect x="70" y="482" width="1380" height="77" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="82" y="501" font-size="12" fill="#1f2937" text-anchor="start" font-weight="700" >Why the control word is pipelined separately from the data</text>
<text x="82" y="519" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >Because cw2 and cw3 hold the control words of the instructions already in MEM and WB, the forwarding and hazard units read their</text>
<text x="82" y="534" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >write-enable and WB-mux bits directly from the CU instead of carrying duplicate copies through the datapath pipeline registers.</text>
<text x="82" y="549" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >That is why EX_MEM_RF_WE comes from cw2(0) and MEM_WB_RF_WE from cw3(0) in the top-level port maps.</text>
<text x="70" y="612" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="700" >Stall / flush arbiter — strict priority</text>
<rect x="70" y="626" width="1380" height="52" rx="7" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<rect x="70" y="626" width="6" height="52" rx="3" fill="#dc2626"/>
<circle cx="108" cy="652" r="14" fill="#dc2626"/>
<text x="108" y="656.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >1</text>
<text x="140" y="657" font-size="13" fill="#1f2937" text-anchor="start" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >cache_miss</text>
<text x="380" y="657" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >freeze everything</text>
<text x="770" y="657" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="400" >PC_EN=0 · all pipeline registers EN=0 · cw1/cw2/cw3 hold</text>
<rect x="70" y="688" width="1380" height="52" rx="7" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<rect x="70" y="688" width="6" height="52" rx="3" fill="#b45309"/>
<circle cx="108" cy="714" r="14" fill="#b45309"/>
<text x="108" y="718.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >2</text>
<text x="140" y="719" font-size="13" fill="#1f2937" text-anchor="start" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >load_use_alarm</text>
<text x="380" y="719" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >stall the front-end, bubble the back-end</text>
<text x="770" y="719" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="400" >PC_EN=0 · IF_ID_EN=0 · ID_EX_CLEAR=1 · cw1 ← 0</text>
<rect x="70" y="750" width="1380" height="52" rx="7" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<rect x="70" y="750" width="6" height="52" rx="3" fill="#b45309"/>
<circle cx="108" cy="776" r="14" fill="#b45309"/>
<text x="108" y="780.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >3</text>
<text x="140" y="781" font-size="13" fill="#1f2937" text-anchor="start" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >branch_stall_alarm</text>
<text x="380" y="781" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >same shape as load-use</text>
<text x="770" y="781" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="400" >PC_EN=0 · IF_ID_EN=0 · ID_EX_CLEAR=1 · cw1 ← 0</text>
<rect x="70" y="812" width="1380" height="52" rx="7" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<rect x="70" y="812" width="6" height="52" rx="3" fill="#d97706"/>
<circle cx="108" cy="838" r="14" fill="#d97706"/>
<text x="108" y="842.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >4</text>
<text x="140" y="843" font-size="13" fill="#1f2937" text-anchor="start" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >mispredict</text>
<text x="380" y="843" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >no stall, just a flush</text>
<text x="770" y="843" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="400" >IF_ID_CLEAR=1 — the wrong-path instruction is discarded</text>
<text x="70" y="898" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >A cache miss outranks everything because the instruction word itself is not available yet; a mispredict is checked last because it is the only</text>
<text x="70" y="916" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" >condition that does not need to stop the clock — the pipeline keeps moving, one instruction is simply thrown away.</text>
</svg>