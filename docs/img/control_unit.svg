<text x="303.0" y="202" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="700" >EQ_COND</text>
<text x="303.0" y="216" font-size="9.5" fill="#2563eb" text-anchor="middle" font-weight="600" >ID</text>
<rect x="386" y="162" width="150" height="60" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
<rect x="386" y="162" width="150" height="5" rx="2" fill="#16a34a"/>
<text x="461.0" y="186" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >[4]</text>
<text x="461.0" y="202" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="700" >MUXA_SEL</text>
<text x="461.0" y="216" font-size="9.5" fill="#16a34a" text-anchor="middle" font-weight="600" >EX</text>
