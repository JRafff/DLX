<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 940" width="1520" height="940" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="1520" height="940" fill="#ffffff"/>
<defs><marker id="a-data" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e3a5f"/></marker><marker id="a-ctrl" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker><marker id="a-fwd" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d97706"/></marker><marker id="a-bnd" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker><marker id="a-ok" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker></defs>
<text x="26" y="40" font-size="21" fill="#1f2937" text-anchor="start" font-weight="600" >Control Unit &#8212; control-word ROM plus an internal control pipeline</text>
<text x="26" y="62" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >The opcode is decoded once, in DECODE. The resulting control word then travels alongside the instruction through</text>
<text x="26" y="79" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" >its own register chain, so every stage receives exactly the bits it needs, in the cycle it needs them.</text>
<text x="26" y="96" font-size="12" fill="#9ca3af" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >src/core/a.a-CU.vhd</text>
<text x="70" y="148" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="700" >Control word (7 bits), from a 64-entry ROM indexed by IR[31:26]</text>
<rect x="70" y="162" width="150" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="70" y="162" width="150" height="5" rx="2" fill="#2563eb"/>
<text x="145.0" y="186" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >[6]</text>
<text x="145.0" y="202" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="700" >JUMP_EN</text>
<text x="145.0" y="216" font-size="9.5" fill="#2563eb" text-anchor="middle" font-weight="600" >ID</text>
